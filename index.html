
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Check-up Appointment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="appointment-card">

            <header class="header">
                <div class="eye-icon">👁</div>
                <p class="tagline">CLEAR VISION, BETTER LIFE</p>
                <h1>Eye Check-up Appointment</h1>
                <p>Book your eye examination appointment with us.</p>
            </header>

            <form id="appointmentForm">

                <h2>Patient Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name"
                               placeholder="Enter your full name"
                               minlength="3" maxlength="60" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age *</label>
                        <input type="number" id="age" name="age"
                               placeholder="Enter your age"
                               min="1" max="120" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email"
                               placeholder="example@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Mobile Number *</label>
                        <input type="tel" id="phone" name="phone"
                               placeholder="10-digit mobile number"
                               pattern="[6-9][0-9]{9}"
                               maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                            <option>Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="visit">Appointment Type *</label>
                        <select id="visit" name="visit" required>
                            <option value="">Select appointment</option>
                            <option>General Eye Check-up</option>
                            <option>Vision Testing</option>
                            <option>Eye Power Check</option>
                            <option>Follow-up Consultation</option>
                        </select>
                    </div>
                </div>

                <h2>Appointment Details</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="date">Preferred Date *</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Preferred Time *</label>
                        <select id="time" name="time" required>
                            <option value="">Select time</option>
                            <option>09:00 AM</option>
                            <option>10:00 AM</option>
                            <option>11:00 AM</option>
                            <option>12:00 PM</option>
                            <option>02:00 PM</option>
                            <option>03:00 PM</option>
                            <option>04:00 PM</option>
                            <option>05:00 PM</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="doctor">Preferred Doctor</label>
                    <select id="doctor" name="doctor">
                        <option value="">No preference</option>
                        <option>Dr. Arun Kumar</option>
                        <option>Dr. Priya Sharma</option>
                        <option>Dr. Rahul</option>
                    </select>
                </div>

                <h2>Additional Information</h2>

                <div class="form-group">
                    <label for="symptoms">Any Eye Problems or Symptoms?</label>
                    <textarea id="symptoms" name="symptoms"
                              rows="4" maxlength="500"
                              placeholder="Describe any eye discomfort, blurred vision, irritation, etc."></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I confirm that the information provided is correct. *
                    </label>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">
                        Book Appointment →
                    </button>
                    <button type="reset" class="reset-btn">
                        Reset Form
                    </button>
                </div>

                <p id="message" role="status" aria-live="polite"></p>

                <p class="note">* Required fields</p>

            </form>

            <footer>
                © 2026 Eye Care Clinic | Your Vision, Our Priority
            </footer>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
